<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pintura 360 - Contato</title>
  <link rel="stylesheet" href="estilos/pintura360.css">
</head>
<body>
  <header>
    <img src="imagens/logo-slogan-pintura.jpg" alt="Logo Pintura 360" width="150">
    <h1>Pintura 360</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="servicos.html">Serviços</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main>
    <h2>Fale Conosco</h2>
    <form id="contatoForm">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Pintura 360 | Catiana Guillaume</p>
    <nav class="redes-sociais">
      <a href="#"><img src="imagens/facebook.svg" alt="Facebook"></a>
      <a href="#"><img src="imagens/instagram.svg" alt="Instagram"></a>
      <a href="#"><img src="imagens/linkedin.svg" alt="LinkedIn"></a>
    </nav>
  </footer>

  <script src="estilos/script.js"></script>
</body>
</html>
