<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="description"
    content="Contato Informações de endereço, telefone, e-mail, mapa e formulário para dúvidas, e fazer orçamento.">
  <meta name="author" content="Catiana Guillaume">
  <title>Pintura 360 - Contato</title>
  <link rel="stylesheet" href="estilos/pintura360.css">
  <script src="scrips/pintura360.js"></script>
  <link rel="stylesheet" href="serviço.html">
  <link rel="stylesheet" href="contato.html">
  <link rel="stylesheet" href="index.html">

</head>

<body>
  <header>
    <img src="imagens/logo-slogan-pintura.jpg" alt="Logo Pintura 360" width="150">
    <h1>Pintura 360</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contato.html">Fale com Nosco</a>
      <a href="servicos.html">serviços</a>

    </nav>
  </header>

  <main>

  <h1>Pintura 360</h1>    
  <p> Rua Riachuelo <br>
      São Paulo, SP<br>
      <a href="tel:+5511961747566">+55 11 96174-7566</a><br>
      <a href="mailto:info@pintura360.com">info@pintura360.com</a>
    </p>

    <!-- Contêiner para mapa + formulário -->
    <div class="contato-container">

      <!-- Mapa -->
      <iframe src="https://www.google.com/maps/embed?..." width="100%" height="300"
        style="border:0;" allowfullscreen="" loading="lazy"></iframe>



    <!-- Formulário -->
      <section class="formulario">

        <h2>Fale Conosco</h2>
        <form>
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required>

          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required>

          <p>Propósito da Mensagem:</p>
          <input type="radio" id="geral" name="proposito" value="geral" required>
          <label for="consulta">Pintura interna e externa</label><br>

          <input type="radio" id="reserva" name="proposito" value="pintura">
          <label for="reserva">Pintura interna</label><br>

          <input type="radio" id="pintura" name="proposito" value="pintura">
          <label for="sugestao">Pintura externa</label><br>

          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" required></textarea>

          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Quero receber a newsletter mensal</label><br>

          <button type="submit" class="btn-enviar">Enviar</button>

        </form>
      </section>
  

  </main>

  <footer>

    <p>&copy; 2026 Pintura 360 🫟 Catiana Guillaume 🫟- Todos os direitos reservados</p>
    <nav class="redes-sociais">
      <a href="https://facebook.com" target="_blank"><img src="imagens/facebook-rafting.svg"
          alt="Facebook" width="50"></a>
      <a href="https://instagram.com" target="_blank"><img src="imagens/instagram-rafting.svg"
          alt="Instagram" width="50"></a>
      <a href="https://linkedin.com" target="_blank"><img src="imagens/linkedin-rafting.svg"
          alt="LinkedIn" width="50"></a>
    </nav>
  </footer>
</body>
</html>
